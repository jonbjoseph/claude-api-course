[project]
name = "claude-academy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jonathan Joseph", email = "jonbjoseph@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
claude-academy = "claude_academy:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
